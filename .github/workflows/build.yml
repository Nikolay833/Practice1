name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release with all builds
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (single-file, self-contained)
        run: >
          dotnet publish src/Dropshelf/Dropshelf.csproj
          -c Release -r win-${{ matrix.arch }} --self-contained true
          -p:Version=1.0.${{ github.run_number }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - name: Name exe after its architecture
        run: Rename-Item out/Dropshelf.exe Dropshelf-${{ matrix.arch }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dropshelf-win-${{ matrix.arch }}
          path: out/Dropshelf-${{ matrix.arch }}.exe
          if-no-files-found: error

  msix:
    # The second distribution: one signed .msixbundle with an x64 and an arm64 package (Windows installs the matching one).
    # Packaged with makeappx / signtool from the Windows SDK on the runner; see packaging/.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build bundle (x64 + arm64)
        shell: pwsh
        run: ./packaging/build-msix.ps1 -Version 1.0.${{ github.run_number }}.0 -OutDir msix-out

      # Uses the MSIX_PFX_BASE64 / MSIX_PFX_PASSWORD secrets when they exist (one certificate for every release, see the README),
      # otherwise a new self-signed certificate for this run.
      - name: Sign bundle
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: ./packaging/sign-msix.ps1 -Bundle msix-out/Dropshelf.msixbundle -OutDir msix-out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dropshelf-msix
          path: |
            msix-out/Dropshelf.msixbundle
            msix-out/Dropshelf.cer
          if-no-files-found: error

  release:
    # Runs on pushes to main, on v* tags, or from the Actions tab via "Run workflow".
    # The portable exes are the main product: if the (newer, more fragile) MSIX job failed, the release still goes out without it.
    if: ${{ !cancelled() && needs.build.result == 'success' && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
    needs: [build, msix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
        run: |
          cp tools/install.ps1 tools/Install-Dropshelf.cmd dist/
          cat > notes.md <<'EOF'
          ## Which file do I download?

          **Easiest:** download `Install-Dropshelf.cmd` and double-click it. It detects your PC and installs the right version.

          Or pick one yourself:

          | Your PC | Download |
          |---|---|
          | Intel or AMD processor (most PCs) | `Dropshelf-x64.exe` |
          | Arm processor (Snapdragon, Surface Pro X / Pro 11, Copilot+ PCs) | `Dropshelf-arm64.exe` |

          Not sure? Open **Settings → System → About** and look at **System type**: "x64-based processor" means x64, "ARM-based processor" means arm64.

          Running the exe installs Dropshelf and starts it at every sign-in. Running a newer exe later updates it.
          EOF
          # The MSIX version (notifications on the island, Windows calendar), only when the msix job produced it.
          if [ -f dist/Dropshelf.msixbundle ] && [ -f dist/Dropshelf.cer ]; then
            cp tools/Install-Dropshelf-MSIX.ps1 dist/
            cat >> notes.md <<'EOF'

          ## MSIX version (optional)

          Adds **notifications on the island** and **Windows calendar** events. One bundle for x64 and Arm64. It is signed with a self-signed certificate, so Windows must trust `Dropshelf.cer` once:

          ```powershell
          irm https://github.com/Nikolay833/Practice1/releases/latest/download/Install-Dropshelf-MSIX.ps1 | iex
          ```

          The script trusts the certificate (it asks for administrator permission once) and installs `Dropshelf.msixbundle`.
          EOF
          else
            echo "::warning::No MSIX bundle in the artifacts; releasing the portable exes only."
          fi
          gh release create "$TAG" dist/* --title "Dropshelf $TAG" --notes-file notes.md --target "$GITHUB_SHA" --latest --verify-tag=false
